
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage_agent"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://triage:triage@postgres:5432/triage_agent
      READONLY_DATABASE_URL: postgresql://triage_readonly:readonly_pw_change_me@postgres:5432/triage_agent
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started


volumes:
  pgdata:


